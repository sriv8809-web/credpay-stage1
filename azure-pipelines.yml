# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: 'acr_serviceconnection'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'
stages:
  - stage: terraform
    displayName: terraform infra
    jobs:
      - job: terraformapply
        displayName: terraform init and apply
        steps:
          - checkout: self
          - task: TerraformInstaller@1
            inputs:
                terraformVersion: 'latest'

          - task: TerraformTask@5
            inputs:
                provider: 'azurerm'
                command: 'init'
                backendServiceArm: 'hdfc-manual'
                backendAzureRmOverrideSubscriptionID: '10aa60ae-f0de-417b-9d25-97aee7d905cb'
                backendAzureRmResourceGroupName: 'capstone-rg'
                backendAzureRmStorageAccountName: 'credpaysa95'
                backendAzureRmContainerName: 'statefile'
                backendAzureRmKey: 'credpay.terraform.tfstate'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: 'hdfc-manual'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              environmentServiceNameAzureRM: 'hdfc-manual'
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'destroy'
              environmentServiceNameAzureRM: 'hdfc-manual'

