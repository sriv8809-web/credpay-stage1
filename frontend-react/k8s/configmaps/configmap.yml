apiVersion: v1
kind: ConfigMap
metadata: 
  name: credpay-config
  Namespace: credpay
  labels: 
    app.kubernetes.io/part-of: credpay
  data:
    DB_HOST: "psql-credpay1.postgres.database.azure.com"
    DB_PORT: "5432"
    DB_NAME: "credpay"
    DB_USERNAME: "credpayadmin"
    spring.database.url: "jdbc:postgressql://psql-credpay1.postgres.database.azure.com:5432/"
    spring.datasource.username: "credpayadmin"
    java_tool_options: "-XX:MaxRAMPercentage=75"

